apply plugin: 'com.android.application'

// Sürüm adı tek yerden gelsin: kök package.json. İki yerde elle tutulmasın.
def appVersionName = new groovy.json.JsonSlurper()
        .parseText(rootProject.file('../package.json').text)
        .version

// versionCode de AYNI kaynaktan türetilir. Eskiden elle "51000" yazıyordu
// (5.10.0'ın karşılığı) ve sürüm yükseldiğinde kimse onu güncellemiyordu.
// Android, versionCode ARTMAMIŞSA güncellemeyi reddeder — üstelik çoğu zaman
// anlaşılmaz bir hatayla. Yani elle tutulan bu sayı, bir sonraki güncellemeyi
// sessizce engelleyecek bir mayındı.
// Formül: 5.16.0 -> 5*10000 + 16*100 + 0 = 51600. Mevcut 51000 değeri de
// 5.10.0 için bu formülün tam sonucudur, yani geçmişle uyumlu ve artan.
def vp = appVersionName.toString().tokenize('.')
def appVersionCode = vp[0].toInteger() * 10000 + vp[1].toInteger() * 100 + vp[2].toInteger()

// İmzalama parolaları build.gradle'a GÖMÜLMEZ; android/keystore.properties'ten
// okunur. Dosya yoksa release yapılandırması imzasız kalır (derleme yine çalışır),
// böylece anahtarı olmayan bir çalışma kopyasında da proje derlenebilir.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKeystore = keystorePropsFile.exists() &&
        rootProject.file(keystoreProps.getProperty('storeFile', '')).exists()

android {
    namespace = "com.hastakayit.app"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    defaultConfig {
        applicationId "com.hastakayit.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
