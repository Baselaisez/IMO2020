<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="Açık bir kitabın üzerinde açan menekşe çiçeği">
  <defs>
    <linearGradient id="sayfa" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEE8F5"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#B99BD8"/><stop offset="1" stop-color="#7A4FA6"/>
    </linearGradient>
    <radialGradient id="hale" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C19A4B" stop-opacity=".55"/><stop offset="1" stop-color="#C19A4B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="260" cy="200" r="190" fill="url(#hale)"/>
  <!-- sekiz köşeli yıldız -->
  <g fill="none" stroke="#C19A4B" stroke-opacity=".45" stroke-width="1.5" transform="translate(260 200)">
    <rect x="-150" y="-150" width="300" height="300" rx="6"/>
    <rect x="-150" y="-150" width="300" height="300" rx="6" transform="rotate(45)"/>
    <circle r="150"/>
  </g>
  <!-- kitap -->
  <g transform="translate(260 330)">
    <path d="M-170 0c40-18 110-22 170 10 60-32 130-28 170-10V-70c-40-18-110-22-170 10-60-32-130-28-170-10z" fill="#33194F" opacity=".35" transform="translate(0 14)"/>
    <path d="M-170 0c40-18 110-22 170 10 60-32 130-28 170-10V-70c-40-18-110-22-170 10-60-32-130-28-170-10z" fill="url(#sayfa)"/>
    <path d="M0-60v70" stroke="#4B2A6F" stroke-width="3"/>
    <g stroke="#4B2A6F" stroke-width="1.6" fill="none" opacity=".5">
      <path d="M-150-44c38-12 90-14 130 2M-150-28c38-12 90-14 130 2M-150-12c38-12 90-14 130 2"/>
      <path d="M150-44c-38-12-90-14-130 2M150-28c-38-12-90-14-130 2M150-12c-38-12-90-14-130 2"/>
    </g>
    <path d="M-170-70c40-18 110-22 170 10 60-32 130-28 170-10" fill="none" stroke="#C19A4B" stroke-width="2"/>
  </g>
  <!-- sap ve yapraklar -->
  <path d="M260 272c-2-50 2-90 6-120" fill="none" stroke="#5E8C5A" stroke-width="5" stroke-linecap="round"/>
  <path d="M262 236c-28-4-46-24-50-48 26 2 46 18 50 48z" fill="#6FA86A"/>
  <path d="M264 212c26-10 36-34 32-58-24 8-38 30-32 58z" fill="#5E8C5A"/>
  <!-- çiçek -->
  <g transform="translate(266 128)">
    <g fill="url(#petal)" stroke="#4B2A6F" stroke-opacity=".25">
      <ellipse cx="0" cy="-34" rx="20" ry="34"/>
      <ellipse cx="0" cy="-34" rx="20" ry="34" transform="rotate(72)"/>
      <ellipse cx="0" cy="-34" rx="20" ry="34" transform="rotate(144)"/>
      <ellipse cx="0" cy="-34" rx="20" ry="34" transform="rotate(216)"/>
      <ellipse cx="0" cy="-34" rx="20" ry="34" transform="rotate(288)"/>
    </g>
    <circle r="14" fill="#F3E9D2"/>
    <circle r="6" fill="#C19A4B"/>
  </g>
  <!-- küçük yıldızlar -->
  <g fill="#F3E9D2" opacity=".9">
    <path d="M90 90l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path d="M430 70l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z"/>
    <path d="M450 250l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M70 260l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
  </g>
</svg>
