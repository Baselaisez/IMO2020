<!doctype html>
<!-- WhatsApp/Facebook paylaşım görseli şablonu (1200x630).
     menekseilim-site klasörü http://localhost:8765/ adresinde sunulurken bu dosyayı
     menekseilim-site/ içine kopyalayıp 1200x630 ekran görüntüsü alın → img/og-gorsel.png -->
<html lang="tr"><meta charset="utf-8">
<link rel="stylesheet" href="/css/fonts.css">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; isolation: isolate; background: #123C41; color: #fff; font-family: "Source Sans 3", Arial, sans-serif; display: grid; grid-template-columns: 430px 1fr; align-items: center; }
body::before { content: ""; position: absolute; inset: 0; z-index: -2; background: url(/img/desen-altin.svg) center / 120px 120px; opacity: .13; }
body::after { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse at 22% 50%, rgba(43, 100, 102, .9), rgba(18, 60, 65, 0) 62%), linear-gradient(180deg, rgba(0, 0, 0, 0) 70%, rgba(10, 34, 37, .45)); }
.sol { display: grid; justify-items: center; gap: 6px; padding-left: 40px; }
.sol img { width: 210px; height: 210px; filter: drop-shadow(0 16px 30px rgba(0, 0, 0, .4)); }
.hat { font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 74px; line-height: 1.3; color: #DCC690; direction: rtl; margin-top: 4px; }
.sag { padding: 0 70px 0 30px; border-left: 1.5px solid rgba(220, 198, 144, .4); }
.ust { font-family: "Amiri", serif; font-size: 34px; color: #DCC690; direction: rtl; text-align: left; display: block; }
h1 { font-family: Lora, Georgia, serif; font-weight: 600; font-size: 64px; line-height: 1.08; margin: 6px 0 14px; }
p { margin: 0; font-size: 29px; line-height: 1.4; color: #D3E0DA; }
.cipler { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.cipler span { border: 1.5px solid rgba(220, 198, 144, .55); border-radius: 999px; padding: 8px 18px; font-size: 21px; font-weight: 600; color: #fff; background: rgba(255, 255, 255, .06); }
.alt { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: linear-gradient(90deg, #B5975A, #DCC690, #B5975A); }
</style>
<body>
  <div class="sol">
    <img src="/img/muhur.svg" alt="">
    <div class="hat" lang="ota">منكشه درنكی</div>
  </div>
  <div class="sag">
    <span class="ust" lang="ar">خيركم من تعلم القرآن وعلمه</span>
    <h1>Menekşe Medreseleri</h1>
    <p>Elif-Ba'dan hafızlığa, İlm-i Hal'den Arapçaya; Kur'an'ın nuruyla yetişen bir nesil.</p>
    <div class="cipler"><span>Gündüzlü ve yatılı</span><span>Kız ve erkek medreseleri</span><span>Kamu yararına dernek</span></div>
  </div>
  <div class="alt"></div>
</body></html>
